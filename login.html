<main class="container py-5 flex-grow-1">
    <div class="row justify-content-center">
        <div class="col-12 col-md-5">
                
            <h2 class="text-center mb-4" style="color: #1E90FF;">Iniciar Sesión</h2>
                
            <div class="card p-4 bg-dark text-white border border-secondary shadow">
                <form id="formLogin">
                    <div class="mb-3">
                        <label for="correoLogin" class="form-label">Correo Electrónico</label>
                        <input type="email" id="correoLogin" class="form-control" placeholder="usuario@gmail.com" required>
                    </div>

                    <div class="mb-4">
                        <label for="passwordLogin" class="form-label">Contraseña</label>
                        <input type="password" id="passwordLogin" class="form-control" placeholder="********" required>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 fw-bold py-2">Entrar</button>
                        
                    <p id="errorLogin" class="text-center mt-3 mb-0 fw-bold"></p>
                </form>
            </div>
                
        </div>
    </div>
