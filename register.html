<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil y Registro | Level-Up Gamer</title>
    <link href="assets/css/style.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <header>
        <a href="index.html" class="navbar-brand text-white text-decoration-none">
        <h1 class="text-center"  >LEVEL-UP GAMER</h1>
        </a>
        <nav class="navbar navbar-dark bg-dark mb-4  mb-5 py-3">
            <div class="container">
                <div>
                    <a class="navbar-brand" href="index.html">Inicio</a>
                    <a class="navbar-brand" href="products.html">Catálogo</a>
                    <a class="navbar-brand" href="index.html#comunidad">Blog y Comunidad</a>
                    <a class="navbar-brand" href="cart.html">Carrito</a>
                    <a class="navbar-brand" href="login.html">Iniciar Sesión</a>
                    <a class="navbar-brand fw-bold" href="register.html">Registrarse</a>
                <a href="contact.html" class="btn fw-bold" style="background-color: transparent; border: 2px solid #39FF14; color: #39FF14;">
                        Contáctanos / Soporte
                </a>
                </div>
            </div>
        </nav>
    </header>

<main class="container mb-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-6 col-lg-5">
            <h2 class="text-center mb-4">Registro usuario</h2>

            <form id="formRegistro" class="bg-dark p-4 rounded">
                <div class="mb-3">
                    <label for="nombre" class="form-label text-white">Nombre Completo</label>
                    <input id="nombre" type="text" class="form-control">
                </div>

                <div class="mb-3">
                    <label for="rut" class="form-label text-white">RUT</label>
                    <input id="rut" type="text" class="form-control">
                </div>

                <div class="mb-3">
                    <label for="correo" class="form-label text-white">Correo Electronico</label>
                    <input id="correo" type="text" class="form-control" placeholder="Ej: alumno@duocuc.cl">
                </div>
                
                <div class="mb-3">
                        <label for="edad" class="form-label text-white">Edad (Minimo 18 años)</label>
                        <input id="edad" type="number" class="form-control" placeholder="Ej: 18">
                </div>

                <button type="submit" class="btn btn-primary w-100 fw-bold">Registrarse</button>


                <p id="errorRegistro" class="text-center mt-3 mb-0 fw-bold"></p>
            </form>
        </div>
    </div>
</main>

<script src="assets/js/register.js"></script>
</body>
</html>
