</head>
<body>
    <header>
        <nav class="navbar navbar-dark bg-dark mb-5 py-3">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="navbar-brandfs-4" href="index.html" style="font-family:'Orbitron',  sans-serif; color: #39FF14;">
                LEVEL-UP GAMER
            </a>

            <div class="d-flex align-items-center gap-4">
                <a class="text-white text-decoration-none" href="index.html">Inicio</a>
                <a class="text-white text-decoration-none" href="index.html#catalogo">Catálogo</a>
                <a class="text-white text-decoration-none" href="index.html#comunidad">Blog y Comunidad</a>
                <a class="text-white text-decoration-none fw-bold" href="register.html">Mi Perfil / Carrito</a>

                        Contáctanos / Soporte
            </div>

    </nav>

<main class="container mb-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-6 col-lg-5">
            <h2 class="text-center mb-4">Registro usuario</h2>

            <form id="formRegistro" class="bg-dark p-4 rounded">
                <div class="mb-3">
                    <label for="nombre" class="form-label text-white">Nombre Completo</label>
                    <imput id="nombre" type="text" class="form-control">
                </div>

                <div class="mb-3">
                    <label for="rut" class="form-label text-white">RUT</label>
                    <imput id="rut" type="text" class="form-control">
                </div>

                <div class="mb-3">
                    <label for="nombre" class="form-label text-white">Nombre Completo</label>
                    <imput id="nombre" type="text" class="form-control">
                </div>

                <div class="mb-3">
                    <label for="correo" class="form-label text-white">Correo Electronico</label>
                    <imput id="correo" type="text" class="form-control" placeholder="Ej: alumno@duocuc.cl">
                </div>
                
                <div class="mb-3">
                        <label for="edad" class="form-label text-white">Edad (Minimo 18 años)</label>
                        <input id="edad" type="number" class="form-control" placeholder="Ej: 18">
                </div>

                <button type="submit" class="btn btn-primary w-100 fw-bold">Registrarse</button>


                <p id="errorRegistro" class="text-center mt-3 mb-0 fw-bold"></p>
            </form>
        </div>
    </div>
</main>

<script src="assets/js/register.js"></script>
