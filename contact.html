<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | Level-Up Gamer</title>
    <link href="assets/css/style.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <header>
        <nav class="navbar navbar-dark bg-dark mb-5 py-3">
            <div class="container d-flex justify-content-between align-items-center">
                <a class="navbar-brand fs-4" href="index.html" style="font-family: 'Orbitron', sans-serif; color: #39FF14;">
                    LEVEL-UP GAMER
                </a>
                
                <div class="d-flex align-items-center gap-4">
                    <a class="text-white text-decoration-none" href="index.html">Inicio</a>
                    <a class="text-white text-decoration-none" href="index.html#catalogo">Catálogo</a>
                    <a class="text-white text-decoration-none" href="index.html#comunidad">Blog y Comunidad</a>
                    <a class="text-white text-decoration-none fw-bold" href="register.html">Mi Perfil / Carrito</a>
                    <a href="contact.html" class="btn fw-bold" style="background-color: transparent; border: 2px solid #39FF14; color: #39FF14;">
                        Contactanos/Soporte
                    </a>
                </div>
            </div>
        </nav>
    </header>

    <main class="container mb-5">
        <div class="row justify-content-center g-4">
            <div class="col-12 col-lg-7">
                <form id="formContactoNuevo" class="bg-dark p-4 rounded text-white border" style="border-color: #1E90FF !important;">
                    <h2 class="text-center mb-4" style="color: #1E90FF;">Formulario de contacto</h2>
                    
                    <div class="mb-3">
                        <label for="nombreContacto" class="form-label">Nombre completo:</label>
                        <input id="nombreContacto" type="text" class="form-control" >
                    </div>
                    <div class="mb-3">
                        <label for="correoContacto" class="form-label">Correo electrónico:</label>
                        <input id="correoContacto" type="email" class="form-control" >
                    </div>
                    <div class="mb-3">
                        <label for="telefonoContacto" class="form-label">Teléfono:</label>
                        <input id="telefonoContacto" type="number" class="form-control" >
                    </div>
                    <div class="mb-3">
                        <label for="tipoConsulta" class="form-label">Tipo de consulta:</label>
                        <select id="tipoConsulta" class="form-select">
                            <option value="" selected disabled>Selecciona una opción</option>
                            <option value="producto">Consulta por producto</option>
                            <option value="pedido">Realizar pedido</option>
                            <option value="seguimiento">Seguimiento de pedido</option>
                            <option value="otro">Otro</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="productoInteres" class="form-label">Producto de interés:</label>
                        <select id="productoInteres" class="form-select">
                            <option value="" selected disabled>Selecciona un producto</option>
                            <option value="catan">Catan</option>
                            <option value="carcassonne">Carcassonne</option>
                            <option value="xbox">Controlador Inalámbrico Xbox Series X</option>
                            <option value="hyperx">Auriculares Gamer HyperX Cloud II</option>
                            <option value="ps5">PlayStation 5</option>
                            <option value="asus">PC Gamer ASUS ROG Strix</option>
                            <option value="secretlab">Silla Gamer Secretlab Titan</option>
                            <option value="logitech">Mouse Gamer Logitech G502 HERO</option>
                            <option value="razer">Mousepad Razer Goliathus</option>
                            <option value="polera">Polera Gamer Personalizada 'Level-Up'</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="cantidad" class="form-label">Cantidad:</label>
                        <input id="cantidad" type="number" class="form-control" min="1" placeholder="Ej: 1">
                    </div>
                    <div class="mb-4">
                        <label for="mensajeContacto" class="form-label">Mensaje:</label>
                        <textarea id="mensajeContacto" class="form-control" rows="4" placeholder="Escriba su consulta..."></textarea>
                    </div>

                    <div class="d-flex gap-2">
                         <button type="button" id="btnEnviarContacto" class="btn btn-primary w-50 fw-bold">Enviar consulta</button>
                         <button type="reset" class="btn btn-secondary w-50 fw-bold">Limpiar formulario</button>
                    </div>                   
                    <p id="errorContactoNuevo" class="text-center mt-3 mb-0 fw-bold"></p>
                </form>
            </div>

            <div class="col-12 col-lg-5">
                <div class="bg-dark p-4 rounded text-white h-100 border" style="border-color: #1E90FF !important;">
                    <h2 class="text-center mb-4" style="color: #1E90FF;">Información de contacto</h2>
                    <h3 style="color: #39FF14;" class="text-center mb-4">LEVEL-UP GAMER</h3>
                    
                    <ul class="list-unstyled mt-4 fs-5 text-center">
                        <li class="mb-4"><strong class="text-secondary d-block">Correo:</strong> contacto@levelupgamer.cl</li>
                        <li class="mb-4"><strong class="text-secondary d-block">Teléfono:</strong> +56 9 1234 5678</li>
                        <li class="mb-4"><strong class="text-secondary d-block">Ubicación:</strong> Santiago, Chile</li>
                    </ul>
                </div>
            </div>
        </div>
    </main>

<script src="assets/js/contact.js"></script>
</body>
</html>
